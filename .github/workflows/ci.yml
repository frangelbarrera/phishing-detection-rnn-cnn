name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest ruff pip-audit
      - name: Lint report (advisory baseline)
        run: |
          set +e
          ruff check . --output-format=github | tee ruff-report.txt
          status=${PIPESTATUS[0]}
          echo "Ruff reported ${status}; findings are recorded as an advisory baseline pending a separate code-quality change."
          exit 0
      - name: Tests
        run: pytest -q
      - name: Dependency audit report
        run: |
          set +e
          pip-audit -r requirements.txt --format json --output pip-audit-report.json
          status=$?
          echo "pip-audit exit status: ${status}; see the artifact for the reproducible result."
          exit 0
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            ruff-report.txt
            pip-audit-report.json
          if-no-files-found: ignore
