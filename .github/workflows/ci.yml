name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest ruff pip-audit
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
